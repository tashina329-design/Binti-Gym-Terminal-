<!doctype html>
<html lang="en" class="dark bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <title>Staff POS & Management Terminal</title>
    <script>
      // Global error suppression for external browser extensions (MetaMask, Web3 wallets, Chrome extensions)
      (function() {
        function isExtensionOrWeb3Error(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.includes('metamask') ||
            str.includes('failed to connect to metamask') ||
            str.includes('ethereum') ||
            str.includes('web3') ||
            str.includes('chrome-extension://') ||
            str.includes('moz-extension://') ||
            str.includes('safari-extension://') ||
            str.includes('evm') ||
            str.includes('wallet')
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || reason)) || '';
          if (isExtensionOrWeb3Error(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          var filename = event.filename || '';
          if (isExtensionOrWeb3Error(msg) || isExtensionOrWeb3Error(filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root" class="bg-slate-950 min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
